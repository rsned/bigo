name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ca80beefdd9b0c42d34242c7f44c5419a433a0f1 # v8.0.0
        with:
          version: v2.1
